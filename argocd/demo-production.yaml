apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stackflow-demo-production
  namespace: argocd
spec:
  project: stackflow
  source:
    repoURL: https://github.com/mohaasdt/stackflow-gitops.git
    targetRevision: main
    path: apps/demo/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-production
  # Intentionally manual at bootstrap. Production sync is permitted only
  # after verified healthy staging and administrator approval of the Git PR.
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
